name: Release

# Automates version bumps, CHANGELOG updates, and release PRs on main via release-please,
# and builds, attests, and publishes the 5 binaries, SHA256SUMS, and install scripts when a release is cut.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Build & Publish Release
    needs: release-please
    if: >-
      !failure() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create or upload assets to the GitHub release
      id-token: write # sign the build provenance attestation with Sigstore OIDC
      attestations: write # store the build provenance attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Tag must match package.json version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Build all platforms (runs lint, type check and tests first)
        run: npm run build:all

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/gather-spotify-status-v*
            bin/SHA256SUMS
            install.sh
            install.ps1

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bin/gather-spotify-status-v* bin/SHA256SUMS install.sh install.ps1 --clobber
          else
            node scripts/release-notes.mjs > release-notes.md
            gh release create "$TAG" bin/gather-spotify-status-v* bin/SHA256SUMS install.sh install.ps1 \
              --title "$TAG" --notes-file release-notes.md --verify-tag
          fi
